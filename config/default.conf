# Auslieferung: statische Dateien, dazu die Regeln, die das Werkzeug braucht.
#
# - Der ausliefernde Dienst ist nginx auf Port 80.
# - Die Anwendung ist eine Seite (eine index.html) mit Service Worker; alle
#   übrigen Wege müssen auf die Startseite zeigen (try_files).
# - sw.js und index.html dürfen NICHT zwischengespeichert werden, sonst bleibt
#   nach einer neuen Fassung die alte Startseite liegen. Alles unter /assets/
#   trägt einen Inhalts-Hash im Namen und darf dauerhaft zwischengespeichert
#   werden.
# - ACHTUNG, nginx-Falle: eine eigene add_header-Zeile in einem location-Block
#   SCHALTET die vom Server geerbten add_header-Zeilen ab. Deshalb wird hier
#   für die Zwischenspeicherung das Verzeichnis expires/etag benutzt (kein
#   add_header in den locations) — sonst fällt die Content-Security-Policy
#   genau auf der Startseite weg, und niemand merkt es.
# - Die Kopfzeile Content-Security-Policy verbietet Fremdaufrufe. Sie erlaubt
#   genau, was das Werkzeug braucht: eigene Dateien, WebAssembly
#   ('wasm-unsafe-eval'), Blob- und Daten-Adressen (Service Worker, FFmpeg im
#   Browser) und die eigenen Wege der Anwendung (connect-src 'self').

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' blob: data:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /gesundheit {
        return 200 "ok\n";
    }

    # Startseite und Service Worker: immer beim Server nachfragen.
    location = /index.html {
        expires -1;
    }

    location = /sw.js {
        expires -1;
    }

    # Gehashte Dateien: ein Jahr zwischenspeichern ist unbedenklich.
    location ~* ^/assets/ {
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
