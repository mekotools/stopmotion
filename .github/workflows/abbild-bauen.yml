name: Abbild bauen

# Baut das fertige Abbild der Web-Fassung und legt es in der Registry ab.
# Gebaut wird ausschliesslich hier (GitHub) - auf flip wird nichts gebaut.
# Der Quelltext kommt festgeschrieben aus dem amtlichen Archiv; der Bau bricht
# ab, wenn die Ankerpruefung in scripts/anpassen.py nicht mehr passt.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  bauen:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4

      - name: Bauwerkzeug einrichten
        uses: docker/setup-buildx-action@v3

      - name: An der Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Abbild bauen und schieben
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/mekotools/stopmotion:latest
            ghcr.io/mekotools/stopmotion:${{ github.sha }}

      - name: Kennwerte melden
        run: |
          echo "Gebaut: ghcr.io/mekotools/stopmotion:${{ github.sha }}"
          docker buildx imagetools inspect ghcr.io/mekotools/stopmotion:latest || true
